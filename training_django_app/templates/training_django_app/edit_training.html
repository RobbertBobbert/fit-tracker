{% extends 'training_django_app/base.html' %}

{% block title %}Редактировать тренировку{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>✏️ Редактировать тренировку</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>⏰ Время</label>
            <input type="time" name="time" class="form-control" value="{{ training.time|time:'H:i' }}" required>
        </div>
        
        <div class="form-group">
            <label>🏋️ Упражнение</label>
            <input type="text" class="form-control" value="{{ training.exercise.name }}" disabled>
        </div>
        
        <div class="form-group">
            <label>⏱️ Длительность (минуты)</label>
            <input type="number" name="duration" class="form-control" value="{{ training.duration_minutes }}" step="1" min="1" required>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Сохранить</button>
            <button type="button" class="btn" style="background: #95a5a6; color: white; flex: 1;" onclick="window.location.href='{% url 'training_django_app:dashboard' %}'">❌ Отмена</button>
        </div>
    </form>
</div>
{% endblock %}
