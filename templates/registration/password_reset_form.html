{% extends 'training_django_app/base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Восстановление пароля</h2>
    <p>Введите email, указанный при регистрации. На него будет отправлена ссылка для сброса пароля.</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
        </div>
        
        <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
    
    <p style="margin-top: 15px;">
        <a href="{% url 'training_django_app:login' %}">Вернуться ко входу</a>
    </p>
</div>
{% endblock %}
